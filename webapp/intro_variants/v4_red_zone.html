<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>V4 · RED ZONE — Duel Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0204;color:#f5e0e0;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none}

/* ── Кровавое небо ── */
.sky{position:fixed;inset:0;background:
  radial-gradient(ellipse at 50% 0%, rgba(255,30,60,.45), transparent 55%),
  radial-gradient(ellipse at 50% 100%, rgba(80,0,30,.5), transparent 60%),
  radial-gradient(ellipse at 80% 40%, rgba(255,80,40,.18), transparent 50%),
  linear-gradient(180deg,#1a0408 0%,#0a0204 60%,#000 100%);}

/* ── Дым/туман (3 слоя, разные скорости) ── */
.fog{position:fixed;left:-50%;right:-50%;height:60vh;
  background:radial-gradient(ellipse at center, rgba(255,40,40,.18), transparent 60%);
  filter:blur(40px);animation:fogMove 22s linear infinite}
.fog.f1{bottom:-10vh;animation-duration:22s;opacity:.6}
.fog.f2{bottom:10vh;animation-duration:34s;animation-direction:reverse;opacity:.4}
.fog.f3{top:-10vh;animation-duration:40s;opacity:.35}
@keyframes fogMove{from{transform:translateX(-20%)}to{transform:translateX(20%)}}

/* ── Зерно/шум плёнки ── */
.grain{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.10;mix-blend-mode:overlay;
  background-image:radial-gradient(circle at 0 0,#fff 1px,transparent 1px),radial-gradient(circle at 3px 5px,#000 1px,transparent 1px);
  background-size:3px 3px,5px 5px;animation:grainShift .2s steps(3) infinite}
@keyframes grainShift{0%{transform:translate(0,0)}33%{transform:translate(-1px,1px)}66%{transform:translate(1px,-1px)}}

/* ── Тяжёлая виньетка ── */
.vignette{position:fixed;inset:0;z-index:6;pointer-events:none;
  box-shadow:inset 0 0 250px rgba(0,0,0,.95),inset 0 0 80px rgba(180,0,30,.3)}

/* ── Капли «крови» на стекле (декор-кляксы) ── */
.drop{position:fixed;z-index:4;border-radius:50%;background:radial-gradient(circle at 30% 30%, #ff2240, #6b0014);
  filter:blur(.5px) drop-shadow(0 4px 6px rgba(0,0,0,.6));opacity:.55;pointer-events:none}
.drop.d1{top:8%;left:6%;width:14px;height:18px}
.drop.d2{top:18%;right:9%;width:9px;height:13px}
.drop.d3{bottom:14%;left:11%;width:11px;height:15px}
.drop.d4{bottom:25%;right:14%;width:7px;height:10px}

/* ── Лезвие-полоса по диагонали ── */
.slash{position:fixed;left:-30%;right:-30%;top:50%;height:2px;
  background:linear-gradient(90deg,transparent,#ff2240 30%,#ff5577 50%,#ff2240 70%,transparent);
  box-shadow:0 0 18px #ff2240,0 0 40px rgba(255,30,60,.5);
  transform:rotate(-12deg);opacity:.7;animation:slashPulse 3.5s ease-in-out infinite}
@keyframes slashPulse{0%,100%{opacity:.55;box-shadow:0 0 18px #ff2240,0 0 40px rgba(255,30,60,.5)}50%{opacity:.95;box-shadow:0 0 28px #ff2240,0 0 70px rgba(255,30,60,.8)}}

.wrap{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 24px;text-align:center}

.year{font-family:"Courier New",monospace;font-size:13px;letter-spacing:8px;color:#ff5577;margin-bottom:6px;opacity:.85}

.title{font-size:clamp(44px,13vw,98px);font-weight:900;letter-spacing:6px;line-height:.95;
  color:#fff;text-shadow:0 0 30px rgba(255,30,60,.7),0 0 60px rgba(180,0,30,.55),0 2px 0 #000;
  filter:drop-shadow(0 0 8px rgba(255,30,60,.4));
  animation:titleHeart 2.4s ease-in-out infinite}
@keyframes titleHeart{0%,100%{transform:scale(1);text-shadow:0 0 30px rgba(255,30,60,.7),0 0 60px rgba(180,0,30,.55),0 2px 0 #000}50%{transform:scale(1.03);text-shadow:0 0 44px rgba(255,30,60,.9),0 0 90px rgba(180,0,30,.7),0 2px 0 #000}}

.tag{margin-top:10px;font-size:11px;letter-spacing:10px;color:#c08080;text-transform:uppercase}

.desc{margin-top:30px;max-width:480px;font-size:16px;line-height:1.7;color:#f0d8d8;
  padding:22px 24px;
  background:linear-gradient(180deg,rgba(60,0,15,.4),rgba(15,2,4,.6));
  border:1px solid rgba(255,40,60,.35);border-radius:2px;
  box-shadow:0 8px 30px rgba(0,0,0,.55),inset 0 0 30px rgba(255,30,60,.08);
  position:relative}
.desc::before{content:'';position:absolute;left:-1px;top:8px;bottom:8px;width:3px;background:linear-gradient(180deg,transparent,#ff2240,transparent)}
.desc b{color:#ff5577}
.desc span{color:#fff;font-weight:700}

.cta{margin-top:34px;display:inline-block;position:relative;
  padding:18px 52px;font-size:17px;font-weight:900;letter-spacing:5px;color:#fff;text-transform:uppercase;
  background:linear-gradient(180deg,#c8112a,#6b0014);
  border:1px solid #ff2240;cursor:pointer;
  box-shadow:0 0 24px rgba(255,30,60,.6),0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.15);
  animation:ctaThrob 1.8s ease-in-out infinite}
@keyframes ctaThrob{0%,100%{box-shadow:0 0 24px rgba(255,30,60,.6),0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.15)}50%{box-shadow:0 0 40px rgba(255,30,60,.95),0 6px 22px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.25)}}
.cta:active{transform:translateY(1px) scale(.98)}

.bar{margin-top:22px;width:240px;height:3px;background:rgba(255,40,60,.15);overflow:hidden;
  border-top:1px solid rgba(255,40,60,.3);border-bottom:1px solid rgba(255,40,60,.3)}
.bar>i{display:block;height:100%;width:0;background:#ff2240;
  box-shadow:0 0 10px #ff2240;animation:bar 3.2s ease-out forwards}
@keyframes bar{from{width:0}to{width:75%}}
.barTxt{margin-top:8px;font-family:"Courier New",monospace;font-size:11px;letter-spacing:3px;color:#c08080;text-transform:uppercase;opacity:.8}
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="fog f1"></div>
  <div class="fog f2"></div>
  <div class="fog f3"></div>
  <div class="slash"></div>
  <div class="drop d1"></div><div class="drop d2"></div>
  <div class="drop d3"></div><div class="drop d4"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="wrap">
    <div class="year">// 2087 // RED ZONE //</div>
    <div class="title">DUEL ARENA</div>
    <div class="tag">кровь · сталь · легенда</div>

    <div class="desc">
      Закон молчит. Деньги — пыль.<br>
      Решает только <b>клинок</b>.<br><br>
      Добро пожаловать в <span>DUEL ARENA</span> — единственное место, где имя ещё что-то значит. Каждый бой — твой шаг к вершине рейтинга.
    </div>

    <button class="cta">ВОЙТИ В АРЕНУ</button>

    <div class="bar"><i></i></div>
    <div class="barTxt">входной канал · защищён</div>
  </div>
</body>
</html>
