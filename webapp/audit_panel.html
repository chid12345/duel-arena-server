  .card .t{font-size:15px;font-weight:800;margin-bottom:4px}
  .card .where{font-size:11px;color:var(--mut);margin-bottom:10px;font-family:monospace}

  .col{border-radius:10px;padding:10px 12px;font-size:13px}
  .now{background:rgba(255,92,122,.08);border:1px solid rgba(255,92,122,.28)}
  .will{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.28)}

// Фильтр: по умолчанию показываем открытые/отложенные, исправленные прячем
// (они остаются в Журнале правок выше и доступны по кнопке).
let _showFixed = false;

function renderReport(){
  let html = MAP_HTML;
  STAGES.filter(s=>s.id>=2).forEach(s=>{
    let fs = FINDINGS.filter(f=>f.stage===s.id);
    const fixedN = fs.filter(f=>f.status==='fixed').length;
    const totalFs = fs.length;
    if(!_showFixed) fs = fs.filter(f=>f.status!=='fixed');
    const [,sttTxt]=SST[s.status];
    const hiddenTag = (!_showFixed && fixedN) ? ` <span class="badge b-fixed">✅ ${fixedN} скрыто</span>` : "";
    html += `<h2>Этап ${s.id} — ${s.title} <span class="badge ${SST[s.status][0].replace('st-','b-').replace('b-wait','b-defer')}">${sttTxt}</span>${hiddenTag}</h2>`;
    if(!fs.length){
      if(totalFs && !_showFixed) html += `<div class="empty">✅ всё исправлено (${fixedN}) — подробности в «Журнале правок» выше.</div>`;
      else html += `<div class="empty">Пока находок нет — этап ещё не пройден.</div>`;
      return;
    }
    fs.forEach(f=>{
      const [scls,stxt]=SEV[f.sev];
      const [bcls,btxt]=STT[f.status];
      html += `<div class="card">
        <div class="t">${f.title}<span class="sev ${scls}">${stxt}</span> <span class="badge ${bcls}">${btxt}</span></div>
        <div class="where">${f.where}</div>
        <div class="cols">
          <div class="col now"><div class="lbl">${f.status==='fixed'?'Было':'Сейчас'}</div>${f.now}</div>
          <div class="col will"><div class="lbl">${f.status==='fixed'?'Стало':'Будет / предложение'}</div>${f.will}</div>
        </div></div>`;
    });
  });
  document.getElementById("report").innerHTML = html;
}

function renderFilterBar(){
  const fixedTotal = FINDINGS.filter(f=>f.status==='fixed').length;
  const label = _showFixed ? `Скрыть исправленные (${fixedTotal})` : `Показать исправленные (${fixedTotal})`;
  document.getElementById("filterbar").innerHTML =
    `<button id="togglefixed" style="background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer">${label}</button>
     <span style="color:var(--mut);font-size:12px;margin-left:10px">по умолчанию видно только открытые и отложенные</span>`;
  document.getElementById("togglefixed").onclick = () => { _showFixed = !_showFixed; renderFilterBar(); renderReport(); };
}

renderFilterBar();
renderReport();
